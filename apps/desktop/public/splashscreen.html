<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TWIG</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #ecfdf5;
        background:
          radial-gradient(120% 90% at 0% 0%, rgba(110, 231, 183, 0.22), transparent 60%),
          radial-gradient(90% 80% at 100% 100%, rgba(6, 78, 59, 0.9), transparent 70%),
          linear-gradient(135deg, #047857, #065f46);
        /* Lets the frameless window be dragged by its body. */
        -webkit-app-region: drag;
      }
      .mark {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          0 12px 30px rgba(2, 44, 34, 0.35);
        animation: rise 600ms ease-out both;
      }
      .mark svg {
        width: 44px;
        height: 44px;
      }
      h1 {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.18em;
        animation: rise 600ms 80ms ease-out both;
      }
      p.tagline {
        margin-top: -10px;
        font-size: 13px;
        color: rgba(236, 253, 245, 0.75);
        animation: rise 600ms 140ms ease-out both;
      }
      .bar {
        width: 180px;
        height: 3px;
        margin-top: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.18);
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #a7f3d0;
        animation: slide 1.1s ease-in-out infinite;
      }
      footer {
        position: fixed;
        bottom: 16px;
        font-size: 11px;
        color: rgba(236, 253, 245, 0.55);
        letter-spacing: 0.02em;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark,
        h1,
        p.tagline {
          animation: none;
        }
        .bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <!-- The TWIG mark: a twig curled like a lowercase t, with a leaf for its arm (design/logo/kit) -->
      <svg viewBox="8 4 256 256">
        <path fill="#ecfdf5" d="M104 178 Q101 110 118 42 Q128 32 137 42 Q140 110 138 174 Q140 202 168 204 Q186 206 196 196 Q194 228 160 232 Q106 232 104 178 Z" />
        <path fill="#ecfdf5" d="M122 92 Q96 86 68 84 Q56 90 68 98 Q96 102 120 110 Z" />
        <path fill="#a7f3d0" d="M132 112 A64 64 0 0 1 216 52 A64 64 0 0 1 132 112 Z" />
      </svg>
    </div>
    <h1>TWIG</h1>
    <p class="tagline">Teacher's Work Integration Gateway</p>
    <div class="bar" role="progressbar" aria-label="Loading"></div>
    <footer>Loading your records · works offline</footer>
  </body>
</html>
