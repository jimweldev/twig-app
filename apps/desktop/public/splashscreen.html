<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TWIG</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #ecfdf5;
        background:
          radial-gradient(120% 90% at 0% 0%, rgba(110, 231, 183, 0.22), transparent 60%),
          radial-gradient(90% 80% at 100% 100%, rgba(6, 78, 59, 0.9), transparent 70%),
          linear-gradient(135deg, #047857, #065f46);
        /* Lets the frameless window be dragged by its body. */
        -webkit-app-region: drag;
      }
      .mark {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          0 12px 30px rgba(2, 44, 34, 0.35);
        animation: rise 600ms ease-out both;
      }
      .mark svg {
        width: 44px;
        height: 44px;
      }
      h1 {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.18em;
        animation: rise 600ms 80ms ease-out both;
      }
      p.tagline {
        margin-top: -10px;
        font-size: 13px;
        color: rgba(236, 253, 245, 0.75);
        animation: rise 600ms 140ms ease-out both;
      }
      .bar {
        width: 180px;
        height: 3px;
        margin-top: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.18);
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #a7f3d0;
        animation: slide 1.1s ease-in-out infinite;
      }
      footer {
        position: fixed;
        bottom: 16px;
        font-size: 11px;
        color: rgba(236, 253, 245, 0.55);
        letter-spacing: 0.02em;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark,
        h1,
        p.tagline {
          animation: none;
        }
        .bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <!-- A twig with two leaves -->
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M14 40 C20 30 26 22 36 10" stroke="#ecfdf5" stroke-width="3.2" stroke-linecap="round" />
        <path d="M22 28 C14 26 10 19 11 12 C18 13 23 19 22 28 Z" fill="#a7f3d0" />
        <path d="M28 20 C30 13 36 9 42 10 C41 17 35 21 28 20 Z" fill="#6ee7b7" />
      </svg>
    </div>
    <h1>TWIG</h1>
    <p class="tagline">Teacher's Work Integration Gateway</p>
    <div class="bar" role="progressbar" aria-label="Loading"></div>
    <footer>Loading your records · works offline</footer>
  </body>
</html>
